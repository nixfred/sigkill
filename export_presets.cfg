; SIGKILL's one export preset (the release prep, 0.33.0-prealpha): a native Linux x86_64 build, one file.
; The renderer is the project's own, Vulkan Forward+ (project.godot rendering/renderer/rendering_method).
; binary_format/embed_pck puts the game's pack inside the binary, so the release is a single executable.
; Left out of the pack: tests/, tools/, docs/ (the README's stills already sit behind docs/media/.gdignore)
; and relay/ (the relay is its own program; the game never loads it). Only resources the game loads from
; scripts/, scenes/, resources/ and shaders/, and the icon, go in.
; Run by tools/export_linux.sh, which needs the engine's export templates installed first.
; Opening the project in the Godot editor may rewrite this file and drop these comments; that is fine.

[preset.0]

name="Linux x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, docs/*, relay/*"
export_path="build/sigkill.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
